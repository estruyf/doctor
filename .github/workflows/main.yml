name: Publish to NPM

# Runs on:
# - a published GitHub release (full release)
# - a push to dev when the commit message contains `#release` (beta release)
# - a manual run (full release by default, beta when the `release` input is unchecked)
on:
  push:
    branches:
      - dev
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a full release (uncheck to publish a beta)"
        type: boolean
        required: false
        default: true

# Trusted publishing: npm checks the GitHub OIDC token of this workflow instead of an npm token.
# The package's settings on npmjs.com name this repository and main.yml as its publisher, so this
# is the only workflow that can publish @estruyf/doctor.
permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # A published release carries the tag ref, not `refs/heads/main`, so gate on
    # the event name instead of the ref.
    if: >-
      contains(github.event.head_commit.message, '#release')
      || github.event_name == 'release'
      || github.event_name == 'workflow_dispatch'

    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/

      # Trusted publishing needs npm 11.5.1 or later; Node 22 ships npm 10. Pinned, so every
      # publish runs the same npm.
      - name: Update npm
        run: npm install -g npm@11.21.0

      # `dev` never publishes a full release: a `#release` commit there triggers this
      # workflow, but it goes out as a beta on the `next` tag. Full releases come from
      # a published GitHub release, or a manual run with the `release` input checked.
      - name: Check if this run is a release
        id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_RELEASE: ${{ inputs.release }}
        run: |
          if [ "$EVENT_NAME" = "release" ] || { [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$MANUAL_RELEASE" = "true" ]; }; then
            echo "release=true" >> $GITHUB_OUTPUT
          else
            echo "release=false" >> $GITHUB_OUTPUT
          fi

      - run: npm i

      - run: npm start

      # No token: npm authenticates with the workflow's OIDC token and adds provenance
      - name: Publish release
        if: steps.check.outputs.release == 'true'
        run: npm publish --access public

      - name: Update the package version
        if: steps.check.outputs.release != 'true'
        run: node scripts/update-package-version.js $GITHUB_RUN_ID

      - name: Publish beta release
        if: steps.check.outputs.release != 'true'
        run: npm publish --tag next --access public
