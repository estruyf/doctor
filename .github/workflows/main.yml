name: Publish to NPM

# Runs on:
# - a published GitHub release
# - a push to dev (beta release, or a full release when the commit message contains `#release`)
# - a manual run (full release by default, beta when the `release` input is unchecked)
on:
  push:
    branches:
      - dev
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a full release (uncheck to publish a beta)"
        type: boolean
        required: false
        default: true

jobs:
  build:
    runs-on: ubuntu-latest
    if: ${{ contains(github.event.head_commit.message, '#release') }}

    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/

      - name: Check if this run is a release
        id: check
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_RELEASE: ${{ inputs.release }}
        run: |
          if [ "$EVENT_NAME" = "release" ] || [ "$MANUAL_RELEASE" = "true" ] || [[ "$COMMIT_MESSAGE" == *"#release"* ]]; then
            echo "release=true" >> $GITHUB_OUTPUT
          else
            echo "release=false" >> $GITHUB_OUTPUT
          fi

      - run: npm i

      - run: npm start

      - name: Publish release
        if: steps.check.outputs.release == 'true'
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{secrets.NPM_TOKEN}}

      - name: Update the package version
        if: steps.check.outputs.release != 'true'
        run: node scripts/update-package-version.js $GITHUB_RUN_ID

      - name: Publish beta release
        if: steps.check.outputs.release != 'true'
        run: npm publish --tag next --access public
        env:
          NODE_AUTH_TOKEN: ${{secrets.NPM_TOKEN}}
